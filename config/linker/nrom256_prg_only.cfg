# ld65 config for the reproduced Super Mario Bros. 32 KiB PRG image.
#
# Output is the bare PRG image, with no iNES header and no CHR. The build
# scripts prepend the validated original header and append the validated
# original CHR after linking.
#
# The layout mirrors the NROM-256 CPU address space exactly: PRG covers
# $8000..$FFF9 and VECTORS contains the NMI/RESET/IRQ triple at $FFFA..$FFFF.
# Together they are exactly $8000 bytes; ld65 errors out rather than silently
# accepting a segment that does not fit.

MEMORY {
    ROM0: file = %O, start = $8000, size = $7FFA, fill = yes, define = yes;
    ROMV: file = %O, start = $FFFA, size = $0006, fill = yes;
}

SEGMENTS {
    PRG: load = ROM0, type = ro;
    VECTORS: load = ROMV, type = ro;
}
