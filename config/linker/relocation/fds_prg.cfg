# ld65 contract for the generated FDS SMB relocation candidate.
#
# Three program insertions consume only the decoder-proven unused end of the
# victory stream. Synthesis tables and vectors remain in fixed slots.

MEMORY {
    PRG0: file = %O, start = $6000, size = $7F00, fill = yes, fillval = $FF;
    TAIL: file = %O, start = $DF00, size = $00FA, fill = yes, fillval = $FF;
    VECTORS: file = %O, start = $DFFA, size = $0006, fill = yes, fillval = $FF;
}

SEGMENTS {
    PRG: load = PRG0, type = rw;
    FIXED_TAIL: load = TAIL, type = rw;
    VECTORS: load = VECTORS, type = rw;
}
