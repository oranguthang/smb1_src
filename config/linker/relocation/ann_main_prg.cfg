# ld65 contract for the generated ANN NSMMAIN relocation candidate.
#
# Six insertions consume source-declared alignment before the initialized save
# byte. The save byte, audio engine, synthesis tables, and vectors stay fixed.

MEMORY {
    PRG0: file = %O, start = $6000, size = $72E3, fill = yes, fillval = $FF;
    TAIL: file = %O, start = $D2E3, size = $0D17, fill = yes, fillval = $FF;
    VECTORS: file = %O, start = $DFFA, size = $0006, fill = yes, fillval = $FF;
}

SEGMENTS {
    PRG: load = PRG0, type = rw;
    FIXED_TAIL: load = TAIL, type = rw;
    VECTORS: load = VECTORS, type = rw;
}
