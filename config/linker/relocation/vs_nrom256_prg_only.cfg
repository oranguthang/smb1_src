# ld65 contract for the generated Vs. Super Mario Bros. relocation candidate.
#
# Five program insertions consume only the decoder-proven unused end of the
# Vs. game-over stream. Synthesis tables and vectors remain in fixed slots.

MEMORY {
    PRG0: file = %O, start = $8000, size = $7F00, fill = yes;
    TAIL: file = %O, start = $FF00, size = $00FA, fill = yes;
    VECTORS: file = %O, start = $FFFA, size = $0006, fill = yes;
}

SEGMENTS {
    PRG: load = PRG0, type = ro;
    FIXED_TAIL: load = TAIL, type = ro;
    VECTORS: load = VECTORS, type = ro;
}
