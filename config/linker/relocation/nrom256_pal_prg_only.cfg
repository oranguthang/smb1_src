# ld65 contract for the generated PAL relocation candidate.
#
# Two program insertions consume the independently decoded PAL music tail. The
# synthesis tables and vector slots retain their original fixed addresses.

MEMORY {
    PRG0: file = %O, start = $8000, size = $7F00, fill = yes;
    TAIL: file = %O, start = $FF00, size = $00FA, fill = yes;
    VECTORS: file = %O, start = $FFFA, size = $0006, fill = yes;
}

SEGMENTS {
    PRG: load = PRG0, type = ro;
    FIXED_TAIL: load = TAIL, type = ro;
    VECTORS: load = VECTORS, type = ro;
}
