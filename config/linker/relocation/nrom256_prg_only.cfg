# ld65 contract for the generated canonical relocation candidate.
#
# The game and audio regions have independent insertion budgets. The synthesis
# tables and vectors remain fixed so the experiment cannot consume unrelated
# data or grow beyond the original 32 KiB CPU window.

MEMORY {
    GAME: file = %O, start = $8000, size = $72D0, fill = yes;
    AUDIO: file = %O, start = $F2D0, size = $0C30, fill = yes;
    TAIL: file = %O, start = $FF00, size = $00FA, fill = yes;
    VECTORS: file = %O, start = $FFFA, size = $0006, fill = yes;
}

SEGMENTS {
    PRG: load = GAME, type = ro;
    AUDIO: load = AUDIO, type = ro;
    FIXED_TAIL: load = TAIL, type = ro;
    VECTORS: load = VECTORS, type = ro;
}
