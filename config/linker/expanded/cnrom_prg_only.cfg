# ld65 config for the CNROM expanded profile's fixed 32 KiB PRG
#
# CNROM changes only the CHR address space. Keeping a separate configuration is
# deliberate: expanded profiles must never silently inherit the preservation
# build's linker entrypoint even when their present PRG layout is identical.

MEMORY {
    ROM0: file = %O, start = $8000, size = $7FFA, fill = yes, define = yes;
    ROMV: file = %O, start = $FFFA, size = $0006, fill = yes;
}

SEGMENTS {
    PRG: load = ROM0, type = ro;
    VECTORS: load = ROMV, type = ro;
}
